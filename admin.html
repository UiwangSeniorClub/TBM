<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자</title>
  <style>
    :root{
      --paper: #F6F3EC;
      --card: #FFFFFF;
      --line: #E3DED1;
      --line-strong: #CFC7B4;
      --ink: #20303F;
      --muted: #6B7686;

      --navy: #1B3A4D;
      --navy-deep: #12283A;
      --safety: #E0631F;
      --safety-weak: #FDEDE1;
      --teal: #14726B;

      --blue: #1D4ED8;
      --blue-weak: #E8F0FF;

      --green: #21793A;
      --green-weak: #E7F3E9;

      --red: #B3261E;
      --red-weak: #FCEAE8;

      --shadow: 0 10px 30px rgba(18, 40, 58, 0.10);
      --shadow-sm: 0 3px 10px rgba(18, 40, 58, 0.06);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      background-image: linear-gradient(180deg, #EFE9DA 0%, var(--paper) 320px);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 18px 48px;
      min-width: 0;
    }

    /* ---------- TOPBAR ---------- */
    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
      padding-top: 4px;
    }

    .topbar button {
      width: auto;
      border: 1.5px solid var(--line-strong);
      background: rgba(255,255,255,0.92);
      color: var(--navy);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 13.5px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    /* ---------- HEADER ---------- */
    .admin-hero {
      position: relative;
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: #fff;
      border-radius: 24px;
      padding: 26px 26px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
      overflow: hidden;
    }

    .admin-hero::before{
      content:"";
      position:absolute;
      inset:0;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(224,99,31,0.14) 0px,
        rgba(224,99,31,0.14) 10px,
        transparent 10px,
        transparent 22px
      );
      opacity:.5;
      -webkit-mask-image: linear-gradient(180deg, transparent 55%, black 100%);
      mask-image: linear-gradient(180deg, transparent 55%, black 100%);
    }

    .admin-eyebrow {
      position: relative;
      display: inline-flex;
      align-items:center;
      gap:6px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: .04em;
      color: #DCEFE9;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .admin-eyebrow .dot{
      width:6px; height:6px; border-radius:50%;
      background: var(--safety);
      box-shadow: 0 0 0 3px rgba(224,99,31,0.25);
    }

    h2 {
      position: relative;
      margin: 14px 0 0;
      font-size: clamp(22px, 3vw, 28px);
      color: #fff;
      letter-spacing: -0.02em;
      font-weight: 900;
    }

    /* ---------- CARD ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      width: 100%;
      min-width: 0;
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h3::before{
      content:"";
      width: 4px;
      height: 18px;
      border-radius: 3px;
      background: var(--teal);
      display: inline-block;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 800;
      color: #3E4A58;
      font-size: 13.5px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px 13px;
      margin-top: 7px;
      box-sizing: border-box;
      font: inherit;
      border-radius: 12px;
      font-size: 14.5px;
    }

    input, select, textarea {
      border: 1.5px solid var(--line-strong);
      background: #FFFEFC;
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s, transform .08s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(20,114,107,0.13);
    }

    textarea { resize: vertical; line-height: 1.7; min-height: 100px; }

    button {
      border: none;
      cursor: pointer;
      font-weight: 800;
      transition: transform .08s, filter .12s, box-shadow .12s, background .12s;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.03); }
    button:active { transform: translateY(0); }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 2px;
    }

    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }

    .hidden { display: none; }

    /* ---------- UNIT LIST ---------- */
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      min-width: 0;
    }

    .unit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #fdfcfa 100%);
      min-width: 0;
      transition: border-color .15s, box-shadow .15s;
    }

    .unit-item.selected {
      border: 2px solid var(--teal);
      background: linear-gradient(180deg, #F0FBF9 0%, #ffffff 100%);
      box-shadow: 0 10px 22px rgba(20,114,107,0.14);
    }

    .unit-name {
      font-weight: 900;
      color: #20324a;
      font-size: 16.5px;
      word-break: keep-all;
    }

    .unit-item.selected .unit-name { color: var(--teal); }

    .unit-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .unit-actions button {
      width: auto;
      padding: 9px 13px;
      margin-top: 0;
      border: 1.5px solid var(--line-strong);
      background: #fff;
      color: var(--navy);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      cursor: pointer;
      font-size: 13.5px;
    }

    .unit-actions button:hover { background: #FAF8F3; }

    .selected-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--blue-weak);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      margin-left: 8px;
    }

    /* ---------- SECTION TITLE ---------- */
    .section-title {
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      color: var(--navy);
      letter-spacing: -0.02em;
      word-break: keep-all;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before{
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--safety);
      box-shadow: 0 0 0 4px rgba(224,99,31,0.16);
      flex-shrink: 0;
    }

    ul { margin: 10px 0 0 20px; padding: 0; }
    li { margin-bottom: 8px; color: #33404D; }

    .qrow {
      border: 1.5px solid var(--line);
      padding: 14px;
      margin-top: 14px;
      border-radius: 14px;
      background: #FCFBF8;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }

    .qrow .row { align-items: stretch; min-width: 0; }

    .qrow button.removeBtn {
      background: #fff;
      color: var(--red);
      border: 1.5px solid #F0C4BE;
      margin-top: 7px;
    }

    .qrow button.removeBtn:hover { background: var(--red-weak); }

    /* ---------- PRIMARY ACTIONS ---------- */
    #addUnitBtn, #addLocationBtn, #addWorkContentBtn, #saveTemplateBtn,
    #loadSubmissionsBtn, #downloadCsvBtn, #addQuestionBtn, #loadCurrentBtn {
      background: linear-gradient(135deg, var(--teal) 0%, var(--navy) 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(20,114,107,0.20);
    }

    #deleteUnitBtn {
      background: linear-gradient(135deg, #C2410C 0%, #8E1B12 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(180,35,24,0.16);
    }

    #renameUnitBtn {
      background: linear-gradient(135deg, #1D4ED8 0%, #1642B3 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(29,78,216,0.16);
    }

    #loginBtn {
      background: linear-gradient(135deg, var(--teal) 0%, var(--navy) 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(20,114,107,0.20);
    }

    /* ---------- TABLE ---------- */
    .table-wrap {
      overflow: auto;
      margin-top: 14px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-sm);
      background: #fff;
      min-width: 0;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13.5px;
      overflow: hidden;
      border-radius: 14px;
      min-width: 0;
    }

    th, td {
      padding: 11px 10px;
      vertical-align: top;
      border-bottom: 1px solid #F0ECE1;
      border-right: 1px solid #F0ECE1;
      word-break: keep-all;
    }

    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    th {
      background: linear-gradient(180deg, #F5F1E8 0%, #EEE7D8 100%);
      color: var(--navy);
      font-weight: 900;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:nth-child(even) td { background: #FBF9F4; }
    tbody tr:hover td { background: #F3FAF9; }

    .small { color: var(--muted); font-size: 12px; line-height: 1.6; }

    @media (max-width: 900px) {
      .unit-item, .row { flex-direction: column; }
      .unit-actions { width: 100%; }
      .unit-actions button { width: 100%; }
      .card h3 { font-size: 18px; }
      .section-title { font-size: 20px; }
      .unit-name { font-size: 16px; }
      .admin-hero { padding: 22px 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <button id="logoutBtn" type="button">로그아웃</button>
    </div>

    <div class="admin-hero">
      <span class="admin-eyebrow"><span class="dot"></span>TBM 관리 콘솔</span>
      <h2>관리자 페이지</h2>
    </div>

    <div id="loginCard" class="card">
      <h3>관리자 비밀번호</h3>
      <input id="adminPassword" type="password" placeholder="비밀번호 입력" />
      <button id="loginBtn">접속</button>
    </div>

    <div id="dashboard" class="hidden">
      <div class="card">
        <h3>사업단 관리</h3>
        <label>사업단 목록</label>
        <div class="unit-list" id="unitsList"></div>

        <label style="margin-top:18px;">사업단 추가</label>
        <input id="newUnitName" type="text" placeholder="새 사업단명" />
        <button id="addUnitBtn" type="button">사업단 추가</button>
      </div>

      <div id="detailsSection" class="hidden">
        <div class="card">
          <div class="section-title" id="selectedUnitLabel">사업단</div>
        </div>

        <div class="card">
          <h3>장소 관리</h3>
          <label>현재 등록된 장소</label>
          <ul id="locationsList"></ul>

          <label style="margin-top:18px;">장소 추가</label>
          <input id="newLocationName" type="text" placeholder="장소명 입력" />
          <button id="addLocationBtn" type="button">장소 추가</button>
        </div>

        <div class="card">
          <h3>작업내용 설정</h3>
          <label>현재 등록된 작업내용</label>
          <ul id="workContentsList"></ul>

          <label style="margin-top:18px;">작업내용 추가</label>
          <input id="newWorkContentName" type="text" placeholder="작업내용 입력" />
          <button id="addWorkContentBtn" type="button">작업내용 추가</button>
        </div>

        <div class="card">
          <h3>체크리스트 관리</h3>
          <label>제목</label>
          <input id="templateTitle" type="text" placeholder="예: 카페 사업단 작업 전 안전점검" />

          <label>안내문</label>
          <textarea id="introText" rows="10" placeholder="안내문 입력"></textarea>

          <div class="row" style="margin-top:10px;">
            <button id="loadCurrentBtn" type="button">현재 버전 불러오기</button>
            <button id="addQuestionBtn" type="button">질문 추가</button>
          </div>

          <div id="questionEditor"></div>

          <button id="saveTemplateBtn" style="margin-top:12px;">새 버전 저장</button>
        </div>

        <div class="card">
          <h3>제출 내역 조회</h3>
          <div class="row">
            <input id="startDate" type="date" />
            <input id="endDate" type="date" />
          </div>
          <div class="row" style="margin-top:10px;">
            <button id="loadSubmissionsBtn" type="button">조회</button>
            <button id="downloadCsvBtn" type="button">CSV 다운로드</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>사업단</th>
                  <th>이름</th>
                  <th>장소</th>
                  <th>작업내용</th>
                  <th>일시</th>
                  <th>제출시각</th>
                  <th>질문</th>
                  <th>예/아니오</th>
                  <th>조치내용</th>
                  <th>주관식</th>
                </tr>
              </thead>
              <tbody id="submissionsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://yiwczbizimfhqomzqluo.supabase.co/';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlpd2N6Yml6aW1maHFvbXpxbHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDY4NjMsImV4cCI6MjEwMDMyMjg2M30.NGro1XNH-LEIdCyGs0BhLmN2VW21CXsqJyThJIiuOAM';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const loginCard = document.getElementById('loginCard');
    const dashboard = document.getElementById('dashboard');
    const adminPassword = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const unitsList = document.getElementById('unitsList');
    const newUnitName = document.getElementById('newUnitName');
    const addUnitBtn = document.getElementById('addUnitBtn');

    const detailsSection = document.getElementById('detailsSection');
    const selectedUnitLabel = document.getElementById('selectedUnitLabel');

    const locationsList = document.getElementById('locationsList');
    const newLocationName = document.getElementById('newLocationName');
    const addLocationBtn = document.getElementById('addLocationBtn');

    const workContentsList = document.getElementById('workContentsList');
    const newWorkContentName = document.getElementById('newWorkContentName');
    const addWorkContentBtn = document.getElementById('addWorkContentBtn');

    const templateTitle = document.getElementById('templateTitle');
    const introText = document.getElementById('introText');
    const questionEditor = document.getElementById('questionEditor');
    const addQuestionBtn = document.getElementById('addQuestionBtn');
    const loadCurrentBtn = document.getElementById('loadCurrentBtn');
    const saveTemplateBtn = document.getElementById('saveTemplateBtn');

    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const loadSubmissionsBtn = document.getElementById('loadSubmissionsBtn');
    const downloadCsvBtn = document.getElementById('downloadCsvBtn');
    const submissionsBody = document.getElementById('submissionsBody');

    let unitsCache = [];
    let selectedUnitId = '';
    let submissionsCache = [];

    function escapeCsv(value) {
      const s = String(value ?? '');
      return `"${s.replaceAll('"', '""')}"`;
    }

    function setDefaultTodayRange() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      const value = `${year}-${month}-${day}`;

      startDate.value = value;
      endDate.value = value;
    }
    
    function formatKST(datetimeStr) {
      if (!datetimeStr) return '';
      return new Date(datetimeStr).toLocaleString('ko-KR', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).replaceAll('.', '-').replace(',', '');
    }

    function setDetailsVisible(visible) {
      detailsSection.classList.toggle('hidden', !visible);
    }

    function addQuestionRow(data = {}) {
      const row = document.createElement('div');
      row.className = 'qrow';
      row.innerHTML = `
        <label>문항</label>
        <input class="q-text" type="text" value="${data.question_text || ''}" placeholder="질문 입력" />

        <div class="row">
          <div>
            <label>타입</label>
            <select class="q-type">
              <option value="yesno">예/아니오</option>
              <option value="text">주관식</option>
            </select>
          </div>
          <div>
            <label>필수</label>
            <select class="q-required">
              <option value="true">필수</option>
              <option value="false">선택</option>
            </select>
          </div>
          <div>
            <label>순서</label>
            <input class="q-order" type="number" value="${data.sort_order ?? 0}" />
          </div>
          <div style="display:flex; align-items:end;">
            <button type="button" class="removeBtn">삭제</button>
          </div>
        </div>
      `;
      row.querySelector('.q-type').value = data.question_type || 'yesno';
      row.querySelector('.q-required').value = String(data.required ?? true);
      row.querySelector('.removeBtn').addEventListener('click', () => row.remove());
      questionEditor.appendChild(row);
    }

    function renderUnitsList() {
      unitsList.innerHTML = '';

      if (!unitsCache.length) {
        unitsList.innerHTML = '<div class="small">등록된 사업단이 없습니다.</div>';
        return;
      }

      unitsCache.forEach(unit => {
        const item = document.createElement('div');
        item.className = 'unit-item' + (unit.id === selectedUnitId ? ' selected' : '');

        const left = document.createElement('div');
        left.innerHTML = `
          <span class="unit-name">${unit.name}</span>
          ${unit.id === selectedUnitId ? '<span class="selected-badge">선택됨</span>' : ''}
        `;

        const actions = document.createElement('div');
        actions.className = 'unit-actions';

        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.textContent = unit.id === selectedUnitId ? '선택 해제' : '선택';
        toggleBtn.addEventListener('click', () => {
          if (unit.id === selectedUnitId) {
            clearSelection();
          } else {
            selectUnit(unit.id);
          }
        });

        const renameBtn = document.createElement('button');
        renameBtn.type = 'button';
        renameBtn.textContent = '이름 수정';
        renameBtn.addEventListener('click', () => renameBusinessUnitInline(unit.id, unit.name));

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.textContent = '삭제';
        deleteBtn.addEventListener('click', () => deleteBusinessUnitInline(unit.id, unit.name));

        actions.appendChild(toggleBtn);
        actions.appendChild(renameBtn);
        actions.appendChild(deleteBtn);

        item.appendChild(left);
        item.appendChild(actions);
        unitsList.appendChild(item);
      });
    }

    async function checkPassword() {
      const entered = adminPassword.value.trim();
      if (!entered) return alert('비밀번호를 입력하세요.');

      const { data, error } = await supabase
        .from('admin_settings')
        .select('admin_password')
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error) return alert('비밀번호 확인 실패: ' + error.message);
      if (!data || data.admin_password !== entered) return alert('비밀번호가 다릅니다.');

      localStorage.setItem('tbm_admin_ok', '1');
      loginCard.classList.add('hidden');
      dashboard.classList.remove('hidden');
      await initAdmin();
    }

    async function loadUnits() {
      const { data, error } = await supabase
        .from('business_units')
        .select('*')
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) return alert('사업단 조회 실패: ' + error.message);

      unitsCache = data || [];
      renderUnitsList();
    }

    async function selectUnit(unitId) {
      selectedUnitId = unitId;
      renderUnitsList();
      setDetailsVisible(true);
      await loadSelectedUnitDetails();
    }

    async function clearSelection() {
      selectedUnitId = '';
      renderUnitsList();
      setDetailsVisible(false);
      selectedUnitLabel.textContent = '사업단';
      locationsList.innerHTML = '';
      workContentsList.innerHTML = '';
      templateTitle.value = '';
      introText.value = '';
      questionEditor.innerHTML = '';
      submissionsBody.innerHTML = '';
    }

    async function loadSelectedUnitDetails() {
      if (!selectedUnitId) return;

      const { data: unit, error: unitErr } = await supabase
        .from('business_units')
        .select('*')
        .eq('id', selectedUnitId)
        .maybeSingle();

      if (unitErr) return alert('사업단 정보 불러오기 실패: ' + unitErr.message);
      if (!unit) return clearSelection();

      selectedUnitLabel.textContent = unit.name;

      await loadLocations();
      await loadWorkContents();
      await loadCurrentTemplate();
    }

    async function addBusinessUnit() {
      const name = newUnitName.value.trim();
      if (!name) return alert('사업단명을 입력하세요.');

      const { error } = await supabase
        .from('business_units')
        .insert([{ name }]);

      if (error) return alert('사업단 추가 실패: ' + error.message);

      newUnitName.value = '';
      await loadUnits();
      alert('사업단 추가 완료');
    }

    async function renameBusinessUnitInline(unitId, oldName) {
      const nextName = prompt('새 사업단 이름을 입력하세요.', oldName);
      if (nextName === null) return;

      const name = nextName.trim();
      if (!name) return alert('이름을 입력하세요.');

      const { error } = await supabase
        .from('business_units')
        .update({ name })
        .eq('id', unitId);

      if (error) return alert('사업단 이름 수정 실패: ' + error.message);

      if (selectedUnitId === unitId) {
        selectedUnitLabel.textContent = name;
      }

      await loadUnits();
      alert('사업단 이름 수정 완료');
    }

    async function deleteBusinessUnitInline(unitId, name) {
      const ok = confirm(`"${name}" 사업단을 삭제하면 관련 장소, 작업내용, 체크리스트, 제출기록, 답변이 모두 삭제됩니다. 정말 삭제할까요?`);
      if (!ok) return;

      const { error } = await supabase.rpc('delete_business_unit', { p_id: unitId });
      if (error) return alert('사업단 삭제 실패: ' + error.message);

      if (selectedUnitId === unitId) {
        await clearSelection();
      }

      await loadUnits();
      alert('사업단 삭제 완료');
    }

    async function loadLocations() {
      if (!selectedUnitId) {
        locationsList.innerHTML = '';
        return;
      }

      const { data, error } = await supabase
        .from('business_locations')
        .select('*')
        .eq('business_unit_id', selectedUnitId)
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) return alert('장소 조회 실패: ' + error.message);

      locationsList.innerHTML = '';
      if (!data || data.length === 0) {
        locationsList.innerHTML = '<li>등록된 장소 없음</li>';
        return;
      }

      data.forEach(loc => {
        const li = document.createElement('li');
        const wrap = document.createElement('div');
        wrap.className = 'row';
        wrap.style.alignItems = 'center';

        const nameDiv = document.createElement('div');
        nameDiv.textContent = loc.name;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '삭제';
        delBtn.style.width = 'auto';
        delBtn.addEventListener('click', async () => {
          const ok = confirm(`장소 "${loc.name}"을(를) 삭제할까요?`);
          if (!ok) return;

          const { error: delErr } = await supabase
            .from('business_locations')
            .delete()
            .eq('id', loc.id);

          if (delErr) return alert('장소 삭제 실패: ' + delErr.message);
          await loadLocations();
        });

        wrap.appendChild(nameDiv);
        wrap.appendChild(delBtn);
        li.appendChild(wrap);
        locationsList.appendChild(li);
      });
    }

    async function addLocation() {
      if (!selectedUnitId) return alert('사업단을 선택하세요.');

      const name = newLocationName.value.trim();
      if (!name) return alert('장소명을 입력하세요.');

      const { error } = await supabase
        .from('business_locations')
        .insert([{ business_unit_id: selectedUnitId, name }]);

      if (error) return alert('장소 추가 실패: ' + error.message);

      newLocationName.value = '';
      await loadLocations();
      alert('장소 추가 완료');
    }

    async function loadWorkContents() {
      if (!selectedUnitId) {
        workContentsList.innerHTML = '';
        return;
      }

      const { data, error } = await supabase
        .from('business_work_contents')
        .select('*')
        .eq('business_unit_id', selectedUnitId)
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) return alert('작업내용 조회 실패: ' + error.message);

      workContentsList.innerHTML = '';
      if (!data || data.length === 0) {
        workContentsList.innerHTML = '<li>등록된 작업내용 없음</li>';
        return;
      }

      data.forEach(item => {
        const li = document.createElement('li');
        const wrap = document.createElement('div');
        wrap.className = 'row';
        wrap.style.alignItems = 'center';

        const nameDiv = document.createElement('div');
        nameDiv.textContent = item.name;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '삭제';
        delBtn.style.width = 'auto';
        delBtn.addEventListener('click', async () => {
          const ok = confirm(`작업내용 "${item.name}"을(를) 삭제할까요?`);
          if (!ok) return;

          const { error: delErr } = await supabase
            .from('business_work_contents')
            .delete()
            .eq('id', item.id);

          if (delErr) return alert('작업내용 삭제 실패: ' + delErr.message);
          await loadWorkContents();
        });

        wrap.appendChild(nameDiv);
        wrap.appendChild(delBtn);
        li.appendChild(wrap);
        workContentsList.appendChild(li);
      });
    }

    async function addWorkContent() {
      if (!selectedUnitId) return alert('사업단을 선택하세요.');

      const name = newWorkContentName.value.trim();
      if (!name) return alert('작업내용을 입력하세요.');

      const { error } = await supabase
        .from('business_work_contents')
        .insert([{ business_unit_id: selectedUnitId, name }]);

      if (error) return alert('작업내용 추가 실패: ' + error.message);

      newWorkContentName.value = '';
      await loadWorkContents();
      alert('작업내용 추가 완료');
    }

    async function loadCurrentTemplate() {
      if (!selectedUnitId) {
        templateTitle.value = '';
        introText.value = '';
        questionEditor.innerHTML = '';
        return;
      }

      const { data: template, error } = await supabase
        .from('checklist_templates')
        .select('*')
        .eq('business_unit_id', selectedUnitId)
        .eq('active', true)
        .order('version', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error) return alert('템플릿 조회 실패: ' + error.message);

      questionEditor.innerHTML = '';

      if (!template) {
        templateTitle.value = '';
        introText.value = '';
        addQuestionRow({ question_type: 'yesno', required: true, sort_order: 1 });
        return;
      }

      templateTitle.value = template.title || '';
      introText.value = template.intro_text || '';

      const { data: questions, error: qErr } = await supabase
        .from('checklist_questions')
        .select('*')
        .eq('template_id', template.id)
        .eq('active', true)
        .order('sort_order', { ascending: true });

      if (qErr) return alert('문항 조회 실패: ' + qErr.message);

      questionEditor.innerHTML = '';
      (questions || []).forEach(q => addQuestionRow(q));
    }

    async function saveNewVersion() {
      if (!selectedUnitId) return alert('사업단을 선택하세요.');
      if (!templateTitle.value.trim()) return alert('제목 입력');
      if (!introText.value.trim()) return alert('안내문 입력');

      const rows = [...questionEditor.querySelectorAll('.qrow')];
      if (rows.length === 0) return alert('질문을 1개 이상 넣으세요.');

      const questions = rows.map((row, idx) => ({
        question_text: row.querySelector('.q-text').value.trim(),
        question_type: row.querySelector('.q-type').value,
        required: row.querySelector('.q-required').value === 'true',
        sort_order: Number(row.querySelector('.q-order').value || idx + 1)
      }));

      if (questions.some(q => !q.question_text)) return alert('빈 질문이 있습니다.');

      const payload = {
        business_unit_id: selectedUnitId,
        title: templateTitle.value.trim(),
        intro_text: introText.value.trim(),
        questions
      };

      const { error } = await supabase.rpc('save_template_version', { payload });
      if (error) return alert('저장 실패: ' + error.message);

      alert('새 버전 저장 완료');
      await loadCurrentTemplate();
      await loadUnits();
    }

    async function loadSubmissions() {
      if (!selectedUnitId) return alert('사업단을 선택하세요.');

      let query = supabase
        .from('submission_answers')
        .select(`
          id,
          answer_yesno,
          correction_text,
          text_answer,
          created_at,
          submissions!inner(
            id,
            worker_name,
            work_datetime,
            location,
            work_content,
            submitted_at,
            business_units(name),
            checklist_templates(title, version)
          ),
          checklist_questions(question_text)
        `)
        .eq('submissions.business_unit_id', selectedUnitId)
        .order('created_at', { ascending: true });

      if (startDate.value) {
        query = query.gte('submissions.work_datetime', new Date(startDate.value + 'T00:00:00').toISOString());
      }

      if (endDate.value) {
        query = query.lte('submissions.work_datetime', new Date(endDate.value + 'T23:59:59.999').toISOString());
      }

      const { data, error } = await query;
      if (error) return alert('제출 조회 실패: ' + error.message);

      submissionsCache = data || [];
      renderSubmissionTable();
    }

    function renderSubmissionTable() {
      submissionsBody.innerHTML = '';
      submissionsCache.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.submissions?.business_units?.name || ''}</td>
          <td>${r.submissions?.worker_name || ''}</td>
          <td>${r.submissions?.location || ''}</td>
          <td>${r.submissions?.work_content || ''}</td>
          <td>${formatKST(r.submissions?.work_datetime)}</td>
          <td>${formatKST(r.submissions?.submitted_at)}</td>
          <td>${r.checklist_questions?.question_text || ''}</td>
          <td>${r.answer_yesno || ''}</td>
          <td>${r.correction_text || ''}</td>
          <td>${r.text_answer || ''}</td>
        `;
        submissionsBody.appendChild(tr);
      });
    }

    function downloadCsv() {
      const rows = [
        ['사업단', '이름', '장소', '작업내용', '일시', '제출시각', '질문', '예/아니오', '조치내용', '주관식']
      ];

      submissionsCache.forEach(r => {
        rows.push([
          r.submissions?.business_units?.name || '',
          r.submissions?.worker_name || '',
          r.submissions?.location || '',
          r.submissions?.work_content || '',
          formatKST(r.submissions?.work_datetime),
          formatKST(r.submissions?.submitted_at),
          r.checklist_questions?.question_text || '',
          r.answer_yesno || '',
          r.correction_text || '',
          r.text_answer || ''
        ]);
      });

      const csv = rows.map(row => row.map(escapeCsv).join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'submissions.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function initAdmin() {
      setDefaultTodayRange();
      await loadUnits();
      await clearSelection();
    }

    loginBtn.addEventListener('click', checkPassword);
    adminPassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('tbm_admin_ok');
      location.reload();
    });

    addUnitBtn.addEventListener('click', addBusinessUnit);
    addLocationBtn.addEventListener('click', addLocation);
    addWorkContentBtn.addEventListener('click', addWorkContent);
    loadCurrentBtn.addEventListener('click', loadCurrentTemplate);
    addQuestionBtn.addEventListener('click', () => addQuestionRow());
    saveTemplateBtn.addEventListener('click', saveNewVersion);
    loadSubmissionsBtn.addEventListener('click', loadSubmissions);
    downloadCsvBtn.addEventListener('click', downloadCsv);

    if (localStorage.getItem('tbm_admin_ok') === '1') {
      loginCard.classList.add('hidden');
      dashboard.classList.remove('hidden');
      initAdmin();
    }
  </script>
</body>
</html>
