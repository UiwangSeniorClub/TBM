<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>의왕시니어클럽 안전확인 일지 (TBM)</title>
  <style>
    :root{
      --paper: #F6F3EC;
      --card: #FFFFFF;
      --line: #E3DED1;
      --line-strong: #CFC7B4;
      --ink: #20303F;
      --muted: #6B7686;

      --navy: #1B3A4D;
      --navy-deep: #12283A;
      --safety: #E0631F;
      --safety-weak: #FDEDE1;
      --teal: #14726B;

      --green: #21793A;
      --green-bg: #E7F3E9;
      --red: #B3261E;
      --red-bg: #FCEAE8;

      --shadow: 0 10px 30px rgba(18, 40, 58, 0.10);
      --shadow-sm: 0 3px 10px rgba(18, 40, 58, 0.06);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: var(--paper);
      background-image:
        linear-gradient(180deg, #EFE9DA 0%, var(--paper) 320px);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 18px 56px;
      min-width: 0;
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: #fff;
      border-radius: 24px;
      padding: 34px 26px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
      overflow: hidden;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(224,99,31,0.14) 0px,
        rgba(224,99,31,0.14) 10px,
        transparent 10px,
        transparent 22px
      );
      opacity:.5;
      -webkit-mask-image: linear-gradient(180deg, transparent 60%, black 100%);
      mask-image: linear-gradient(180deg, transparent 60%, black 100%);
    }

    .hero-top{
      position: relative;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items:center;
      gap:6px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: .04em;
      color: #DCEFE9;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .hero-eyebrow .dot{
      width:6px; height:6px; border-radius:50%;
      background: var(--safety);
      box-shadow: 0 0 0 3px rgba(224,99,31,0.25);
    }

    .hero h1 {
      position: relative;
      margin: 16px 0 0;
      font-size: clamp(22px, 5vw, 28px);
      line-height: 1.35;
      letter-spacing: -0.01em;
      font-weight: 900;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .hero p.hero-sub {
      position: relative;
      margin: 8px 0 0;
      color: rgba(255,255,255,0.72);
      font-size: 13.5px;
      font-weight: 500;
    }

    .stamp {
      flex: 0 0 auto;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid var(--safety);
      display:flex; align-items:center; justify-content:center;
      color: var(--safety);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: -.02em;
      text-align:center;
      line-height:1.15;
      background: rgba(224,99,31,0.08);
      transform: rotate(-8deg);
    }

    /* ---------- STEP LABEL ---------- */
    .step-label {
      display:flex;
      align-items:center;
      gap:10px;
      margin: 0 2px 12px;
    }

    .step-num {
      flex: 0 0 auto;
      width: 26px; height: 26px;
      border-radius: 8px;
      background: var(--navy);
      color:#fff;
      font-size: 12px;
      font-weight: 900;
      display:flex; align-items:center; justify-content:center;
    }

    .step-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: .01em;
    }

    /* ---------- CARD ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: clip;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      min-width: 0;
    }

    .field { display:flex; flex-direction:column; gap: 7px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 13.5px;
      font-weight: 800;
      color: #3E4A58;
    }

    input, select, textarea {
      width: 100%;
      font: inherit;
      min-width: 0;
      border: 1.5px solid var(--line-strong);
      background: #FFFEFC;
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
      font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(20,114,107,0.13);
    }

    textarea { resize: vertical; min-height: 110px; line-height: 1.7; }

    button { width:100%; font: inherit; cursor: pointer; }

    /* ---------- CHECKLIST READBOX ---------- */
    .readbox {
      background: linear-gradient(180deg, #FBF9F4 0%, #F6F2E8 100%);
      border: 1.5px dashed var(--line-strong);
      border-radius: 16px;
      padding: 18px 18px 16px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: clip;
    }

    .big-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
      line-height: 1.3;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .subtitle { font-size: 15px; font-weight: 700; color: var(--teal); }

    .intro-text {
      margin: 10px 0 0;
      white-space: pre-wrap;
      line-height: 1.85;
      font-size: 15.5px;
      font-weight: 500;
      color: #33404D;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    /* ---------- QUESTIONS ---------- */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }

    .question {
      position: relative;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 16px;
      padding: 16px 16px 16px 18px;
      width: 100%;
      min-width: 0;
      overflow-x: clip;
    }

    .question::before{
      content:"";
      position:absolute;
      left:0; top:12px; bottom:12px;
      width: 4px;
      border-radius: 4px;
      background: var(--line-strong);
    }

    .question-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #202D3A;
      line-height: 1.5;
      margin-bottom: 13px;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .required-mark { color: var(--safety); margin-left: 4px; font-weight: 900; }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
      min-width: 0;
      max-width: 100%;
    }

    .choice {
      border: 1.5px solid var(--line-strong);
      border-radius: 13px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      transition: transform .08s, box-shadow .15s, border-color .15s, background .15s;
      background: #fff;
      min-height: 50px;
      display: flex;
      align-items: stretch;
      min-width: 0;
      max-width: 100%;
    }

    .choice:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }

    .choice input { position: absolute; opacity: 0; pointer-events: none; }

    .choice span {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      font-weight: 800;
      font-size: 15px;
      color: #4A5563;
      user-select: none;
      gap: 8px;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .choice-yes input:checked + span {
      background: var(--green-bg);
      color: var(--green);
      box-shadow: inset 0 0 0 1.5px rgba(33,121,58,0.35);
    }

    .choice-no input:checked + span {
      background: var(--red-bg);
      color: var(--red);
      box-shadow: inset 0 0 0 1.5px rgba(179,38,30,0.35);
    }

    .choice-yes span::before { content: "✔"; font-size: 12px; opacity: .85; }
    .choice-no span::before { content: "✕"; font-size: 12px; opacity: .85; }

    .correction-wrap {
      margin-top: 10px;
      background: var(--safety-weak);
      border: 1px solid #F0C9A9;
      border-radius: 13px;
      padding: 13px;
    }

    .correction-wrap label { color: #9A4A16; font-size: 13px; }

    .hidden { display: none; }

    /* ---------- SUBMIT ---------- */
    .submit-wrap { margin-top: 10px; }

    .submit-btn {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--navy) 100%);
      color: #fff;
      font-weight: 900;
      font-size: 16.5px;
      padding: 16px 16px;
      box-shadow: 0 12px 24px rgba(20,114,107,0.22);
      cursor: pointer;
      letter-spacing: .01em;
    }

    .submit-btn:hover { filter: brightness(1.05); }
    .submit-btn:active { transform: translateY(1px); }

    .footer-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }

    .topbar {
      display: flex;
      justify-content: center;
      margin-top: 22px;
      margin-bottom: 0;
    }

    .topbar button {
      width: auto;
      border: 1.5px solid var(--line-strong);
      background: #fff;
      color: var(--navy);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 13.5px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    /* ---------- ACCESSIBILITY ---------- */
    a:focus-visible, button:focus-visible, .choice input:focus-visible + span {
      outline: 3px solid var(--teal);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .choice, .submit-btn { transition: none; }
    }

    @media (max-width: 720px) {
      .field-grid { grid-template-columns: 1fr; }
      .radio-group { grid-template-columns: 1fr; }
      .choice { width: 100%; }
      .hero { padding: 24px 20px; }
      .card { padding: 17px; }
      .big-title { font-size: 18px; }
      .subtitle { font-size: 14px; }
      * { min-width: 0; }
      input, select, textarea, button { max-width: 100%; }
      input[type="datetime-local"], input[type="date"], select { min-width: 0; max-width: 100%; width: 100%; }
      .hero, .card, .readbox, .question, .field-grid, .question-list, .radio-group {
        max-width: 100%; overflow-x: hidden;
      }
      .intro-text, .question-title, .hero h1, .big-title, .subtitle {
        word-break: break-word; overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="hero">
      <div class="hero-top">
        <div>
          <span class="hero-eyebrow"><span class="dot"></span>안전 확인 일지</span>
          <h1>의왕시니어클럽<br/>TBM 안전확인 일지</h1>
          <p class="hero-sub">작업을 시작하기 전, 오늘의 안전을 함께 점검해요</p>
        </div>
        <div class="stamp">SAFETY<br/>CHECK</div>
      </div>
    </div>

    <div class="step-label">
      <span class="step-num">1</span>
      <span class="step-text">기본 정보 입력</span>
    </div>
    <div class="card">
      <div class="field-grid">
        <div class="field">
          <label>사업단명</label>
          <select id="businessUnitSelect"></select>
        </div>

        <div class="field">
          <label>이름</label>
          <input id="workerName" type="text" placeholder="이름 입력" />
        </div>

        <div class="field">
          <label>일시</label>
          <input id="workDatetime" type="datetime-local" />
        </div>

        <div class="field">
          <label>장소</label>
          <select id="locationSelect"></select>
        </div>

        <div class="field full">
          <label>작업내용</label>
          <select id="workContentSelect"></select>
        </div>
      </div>
    </div>

    <div class="step-label">
      <span class="step-num">2</span>
      <span class="step-text">안전점검 리스트 확인</span>
    </div>
    <div class="card readbox">
      <div class="big-title">
        안전점검 리스트<br>
        <span class="subtitle">잠재위험요인 및 대책</span>
      </div>
      <pre id="introText" class="intro-text"></pre>
    </div>

    <div class="step-label">
      <span class="step-num">3</span>
      <span class="step-text">작업 전 안전조치 여부</span>
    </div>
    <div class="card">
      <div id="questionsArea" class="question-list"></div>
    </div>

    <div class="submit-wrap">
      <button id="submitBtn" class="submit-btn">제출하기</button>
      <div class="footer-note">입력 후 제출 버튼을 눌러 저장하세요.</div>
    </div>

    <div class="topbar">
      <a href="admin.html" style="text-decoration:none;">
        <button type="button">관리자 페이지</button>
      </a>
    </div>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://yiwczbizimfhqomzqluo.supabase.co/';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlpd2N6Yml6aW1maHFvbXpxbHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDY4NjMsImV4cCI6MjEwMDMyMjg2M30.NGro1XNH-LEIdCyGs0BhLmN2VW21CXsqJyThJIiuOAM';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const businessUnitSelect = document.getElementById('businessUnitSelect');
    const workerName = document.getElementById('workerName');
    const workDatetime = document.getElementById('workDatetime');
    const locationSelect = document.getElementById('locationSelect');
    const workContentSelect = document.getElementById('workContentSelect');
    const introText = document.getElementById('introText');
    const questionsArea = document.getElementById('questionsArea');
    const submitBtn = document.getElementById('submitBtn');

    let currentTemplate = null;
    let currentQuestions = [];

    function nowLocalDatetime() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function setDefaultDatetime() {
      workDatetime.value = nowLocalDatetime();
    }

    function renderQuestions() {
      questionsArea.innerHTML = '';

      currentQuestions.forEach((q) => {
        const wrap = document.createElement('div');
        wrap.className = 'question';
        wrap.dataset.questionId = q.id;

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerHTML = `${q.sort_order}. ${q.question_text}${q.required ? '<span class="required-mark">*</span>' : ''}`;
        wrap.appendChild(title);

        if (q.question_type === 'yesno') {
          const radio = document.createElement('div');
          radio.className = 'radio-group';
          radio.innerHTML = `
            <label class="choice choice-yes">
              <input type="radio" name="q_${q.id}" value="예">
              <span>예</span>
            </label>
            <label class="choice choice-no">
              <input type="radio" name="q_${q.id}" value="아니오">
              <span>아니오</span>
            </label>
          `;
          wrap.appendChild(radio);

          const correctionWrap = document.createElement('div');
          correctionWrap.className = 'correction-wrap hidden';
          correctionWrap.innerHTML = `
            <label>아니오인 경우 조치 내용</label>
            <textarea rows="3" class="correction" placeholder="조치 내용 입력"></textarea>
          `;
          wrap.appendChild(correctionWrap);

          radio.addEventListener('change', (e) => {
            const selected = e.target?.value;
            if (!selected) return;

            correctionWrap.classList.toggle('hidden', selected !== '아니오');
          });
        } else {
          const ta = document.createElement('textarea');
          ta.rows = 4;
          ta.className = 'text-answer';
          ta.placeholder = q.required ? '입력' : '선택 입력';
          wrap.appendChild(ta);
        }

        questionsArea.appendChild(wrap);
      });
    }

    async function loadBusinessUnits() {
      const { data, error } = await supabase
        .from('business_units')
        .select('*')
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) {
        alert('사업단 불러오기 실패: ' + error.message);
        return;
      }

      businessUnitSelect.innerHTML = '<option value="">사업단 선택</option>';
      locationSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      workContentSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      introText.textContent = '사업단을 선택하세요.';
      questionsArea.innerHTML = '';
      currentTemplate = null;
      currentQuestions = [];

      if (!data || data.length === 0) {
        businessUnitSelect.innerHTML = '<option value="">등록된 사업단 없음</option>';
        locationSelect.innerHTML = '<option value="">등록된 장소 없음</option>';
        workContentSelect.innerHTML = '<option value="">등록된 작업내용 없음</option>';
        return;
      }

      data.forEach(unit => {
        const opt = document.createElement('option');
        opt.value = unit.id;
        opt.textContent = unit.name;
        businessUnitSelect.appendChild(opt);
      });
    }

    async function loadLocations(businessUnitId) {
      const { data, error } = await supabase
        .from('business_locations')
        .select('*')
        .eq('business_unit_id', businessUnitId)
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) {
        alert('장소 불러오기 실패: ' + error.message);
        return;
      }

      locationSelect.innerHTML = '<option value="">장소 선택</option>';
      if (!data || data.length === 0) {
        locationSelect.innerHTML = '<option value="">등록된 장소 없음</option>';
        return;
      }

      data.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc.name;
        opt.textContent = loc.name;
        locationSelect.appendChild(opt);
      });
    }

    async function loadWorkContents(businessUnitId) {
      const { data, error } = await supabase
        .from('business_work_contents')
        .select('*')
        .eq('business_unit_id', businessUnitId)
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) {
        alert('작업내용 불러오기 실패: ' + error.message);
        return;
      }

      workContentSelect.innerHTML = '<option value="">작업내용 선택</option>';
      if (!data || data.length === 0) {
        workContentSelect.innerHTML = '<option value="">등록된 작업내용 없음</option>';
        return;
      }

      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        workContentSelect.appendChild(opt);
      });
    }

    async function loadTemplateAndLists(businessUnitId) {
      if (!businessUnitId) {
        introText.textContent = '사업단을 선택하세요.';
        questionsArea.innerHTML = '';
        locationSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
        workContentSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
        currentTemplate = null;
        currentQuestions = [];
        return;
      }

      const { data: template, error: tplErr } = await supabase
        .from('checklist_templates')
        .select('*')
        .eq('business_unit_id', businessUnitId)
        .eq('active', true)
        .order('version', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (tplErr) {
        alert('템플릿 불러오기 실패: ' + tplErr.message);
        return;
      }

      currentTemplate = template;

      if (!template) {
        introText.textContent = '활성화된 체크리스트가 없습니다.';
        questionsArea.innerHTML = '';
        currentQuestions = [];
        await loadLocations(businessUnitId);
        await loadWorkContents(businessUnitId);
        return;
      }

      introText.textContent = template.intro_text || '';

      const { data: questions, error: qErr } = await supabase
        .from('checklist_questions')
        .select('*')
        .eq('template_id', template.id)
        .eq('active', true)
        .order('sort_order', { ascending: true });

      if (qErr) {
        alert('질문 불러오기 실패: ' + qErr.message);
        return;
      }

      currentQuestions = questions || [];
      renderQuestions();
      await loadLocations(businessUnitId);
      await loadWorkContents(businessUnitId);
    }

    businessUnitSelect.addEventListener('change', () => {
      loadTemplateAndLists(businessUnitSelect.value);
    });

    submitBtn.addEventListener('click', async () => {
      if (!businessUnitSelect.value) return alert('사업단을 선택하세요.');
      if (!workerName.value.trim()) return alert('이름을 입력하세요.');
      if (!workDatetime.value) return alert('일시를 입력하세요.');
      if (!locationSelect.value) return alert('장소를 선택하세요.');
      if (!workContentSelect.value) return alert('작업내용을 선택하세요.');
      if (!currentTemplate) return alert('활성 체크리스트가 없습니다.');

      const answers = [];

      for (const q of currentQuestions) {
        const block = questionsArea.querySelector(`[data-question-id="${q.id}"]`);

        if (q.question_type === 'yesno') {
          const checked = block.querySelector(`input[name="q_${q.id}"]:checked`);
          if (!checked) return alert(`"${q.question_text}"에 답하세요.`);

          const yesno = checked.value;
          const correction = block.querySelector('.correction').value.trim();

          if (yesno === '아니오' && !correction) {
            return alert(`"${q.question_text}"에서 아니오 선택 시 조치 내용을 입력하세요.`);
          }

          answers.push({
            question_id: q.id,
            answer_yesno: yesno,
            correction_text: yesno === '아니오' ? correction : '',
            text_answer: ''
          });
        } else {
          const text = block.querySelector('.text-answer').value.trim();
          if (q.required && !text) return alert(`"${q.question_text}"을(를) 입력하세요.`);

          answers.push({
            question_id: q.id,
            answer_yesno: '',
            correction_text: '',
            text_answer: text
          });
        }
      }

      const payload = {
        business_unit_id: businessUnitSelect.value,
        template_id: currentTemplate.id,
        worker_name: workerName.value.trim(),
        work_datetime: new Date(workDatetime.value).toISOString(),
        location: locationSelect.value,
        work_content: workContentSelect.value,
        answers
      };

      const { error } = await supabase.rpc('submit_checklist', { payload });
      if (error) {
        alert('제출 실패: ' + error.message);
        return;
      }

      alert('제출 완료');
      workerName.value = '';
      setDefaultDatetime();
      locationSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      workContentSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      questionsArea.innerHTML = '';
      introText.textContent = '사업단을 선택하세요.';
      currentTemplate = null;
      currentQuestions = [];
    });

    setDefaultDatetime();
    loadBusinessUnits();
  </script>
</body>
</html>
