<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>의왕시니어클럽 안전확인 일지 (TBM)</title>
  <style>
    :root{
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #dbe4ee;
      --text: #1f2a37;
      --muted: #667085;
  
      --navy: #17324d;
      --teal: #0f766e;
      --teal-weak: #e6fffb;
  
      --green: #2e7d32;
      --green-bg: #e8f5e9;
  
      --red: #b42318;
      --red-bg: #ffebee;
  
      --amber: #b45309;
      --amber-bg: #fff7ed;
  
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      --radius: 18px;
    }
  
    * {
      box-sizing: border-box;
    }
  
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
  
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15,118,110,0.10), transparent 32%),
        radial-gradient(circle at top right, rgba(23,50,77,0.08), transparent 25%),
        var(--bg);
      color: var(--text);
    }
  
    .page {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 40px;
      min-width: 0;
    }
  
    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }
  
    .topbar button {
      width: auto;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
    }
  
    .hero {
      background: linear-gradient(135deg, #17324d 0%, #0f766e 100%);
      color: #fff;
      border-radius: 24px;
      padding: 22px 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }
  
    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
  
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 10px;
    }
  
    .hero h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
  
    .hero p {
      margin: 10px 0 0;
      color: rgba(255,255,255,0.84);
      font-size: 14px;
    }
  
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: clip;
    }
  
    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.01em;
    }
  
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      min-width: 0;
    }
  
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
  
    .field.full {
      grid-column: 1 / -1;
    }
  
    label {
      font-size: 14px;
      font-weight: 800;
      color: #344054;
    }
  
    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      min-width: 0;
    }
  
    button {
      width: 100%;
      font: inherit;
      cursor: pointer;
    }
  
    input,
    select,
    textarea {
      border: 1px solid #cfd8e3;
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      transition: border-color .15s, box-shadow .15s, transform .1s;
      outline: none;
    }
  
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(15,118,110,0.12);
    }
  
    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }
  
    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
  
    .readbox {
      background: linear-gradient(180deg, #fbfdff 0%, #f8fbff 100%);
      border: 1px solid #d8e3ee;
      border-radius: 16px;
      padding: 16px 16px 14px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: clip;
    }
  
    .intro-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 16px;
      font-weight: 500;
      color: #1f2937;
      overflow-wrap: anywhere;
      word-break: keep-all;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }
  
    .big-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      line-height: 1.25;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
  
    .subtitle {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
    }
  
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }
  
    .question {
      border: 1px solid #dde7f1;
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      width: 100%;
      min-width: 0;
      overflow-x: clip;
    }
  
    .question-title {
      font-size: 16px;
      font-weight: 800;
      color: #20324a;
      line-height: 1.45;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
  
    .required-mark {
      color: var(--red);
      margin-left: 4px;
      font-weight: 900;
    }
  
    .radio-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
      min-width: 0;
      max-width: 100%;
    }
  
    .choice {
      border: 1px solid #d6dde7;
      border-radius: 14px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      transition: transform .08s, box-shadow .15s, border-color .15s;
      background: #fff;
      min-height: 48px;
      display: flex;
      align-items: stretch;
      min-width: 0;
      max-width: 100%;
    }
  
    .choice:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16,24,40,0.08);
    }
  
    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
  
    .choice span {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      font-weight: 800;
      color: #344054;
      user-select: none;
      gap: 8px;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
  
    .choice-yes input:checked + span {
      background: var(--green-bg);
      color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(46,125,50,0.25);
    }
  
    .choice-no input:checked + span {
      background: var(--red-bg);
      color: var(--red);
      box-shadow: inset 0 0 0 1px rgba(180,35,24,0.25);
    }
  
    .choice-yes span::before {
      content: "✔";
      font-size: 12px;
      opacity: .8;
    }
  
    .choice-no span::before {
      content: "✕";
      font-size: 12px;
      opacity: .8;
    }
  
    .correction-wrap {
      margin-top: 10px;
      background: var(--amber-bg);
      border: 1px solid #f3d3b0;
      border-radius: 14px;
      padding: 12px;
    }
  
    .correction-wrap label {
      color: #9a4d00;
      font-size: 13px;
    }
  
    .hidden {
      display: none;
    }
  
    .submit-wrap {
      margin-top: 8px;
    }
  
    .submit-btn {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--teal) 0%, #0b5f75 100%);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      padding: 14px 16px;
      box-shadow: 0 10px 20px rgba(15,118,110,0.20);
      cursor: pointer;
    }
  
    .submit-btn:hover {
      filter: brightness(1.03);
    }
  
    .footer-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  
    @media (max-width: 720px) {
      .field-grid {
        grid-template-columns: 1fr;
      }
  
      .radio-group {
        grid-template-columns: 1fr;
      }
  
      .choice {
        width: 100%;
      }
  
      .hero {
        padding: 18px;
      }
  
      .card {
        padding: 16px;
      }
  
      .big-title {
        font-size: 20px;
      }
  
      .subtitle {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a href="admin.html" style="text-decoration:none;">
        <button type="button">관리자 페이지</button>
      </a>
    </div>

    <div class="hero">
      <div class="hero-badge">TBM · 안전확인</div>
      <h1>의왕시니어클럽 안전확인 일지 (TBM)</h1>
    </div>

    <div class="card">
      <div class="section-title">기본 정보</div>
      <div class="field-grid">
        <div class="field">
          <label>사업단명</label>
          <select id="businessUnitSelect"></select>
        </div>

        <div class="field">
          <label>이름</label>
          <input id="workerName" type="text" placeholder="이름 입력" />
        </div>

        <div class="field">
          <label>일시</label>
          <input id="workDatetime" type="datetime-local" />
        </div>

        <div class="field">
          <label>장소</label>
          <select id="locationSelect"></select>
        </div>

        <div class="field full">
          <label>작업내용</label>
          <select id="workContentSelect"></select>
        </div>
      </div>
    </div>

    <div class="card readbox">
      <div class="big-title">
        안전점검 리스트<br>
        <span class="subtitle">(잠재위험요인 및 대책)</span>
      </div>
      <pre id="introText" class="intro-text"></pre>
    </div>

    <div class="card">
      <div class="big-title">작업 전 안전조치 여부</div>
      <div id="questionsArea" class="question-list"></div>
    </div>

    <div class="submit-wrap">
      <button id="submitBtn" class="submit-btn">제출</button>
      <div class="footer-note">입력 후 제출 버튼을 눌러 저장하세요.</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://yiwczbizimfhqomzqluo.supabase.co/';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlpd2N6Yml6aW1maHFvbXpxbHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDY4NjMsImV4cCI6MjEwMDMyMjg2M30.NGro1XNH-LEIdCyGs0BhLmN2VW21CXsqJyThJIiuOAM';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const businessUnitSelect = document.getElementById('businessUnitSelect');
    const workerName = document.getElementById('workerName');
    const workDatetime = document.getElementById('workDatetime');
    const locationSelect = document.getElementById('locationSelect');
    const workContentSelect = document.getElementById('workContentSelect');
    const introText = document.getElementById('introText');
    const questionsArea = document.getElementById('questionsArea');
    const submitBtn = document.getElementById('submitBtn');

    let currentTemplate = null;
    let currentQuestions = [];

    function nowLocalDatetime() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function setDefaultDatetime() {
      workDatetime.value = nowLocalDatetime();
    }

    function renderQuestions() {
      questionsArea.innerHTML = '';

      currentQuestions.forEach((q) => {
        const wrap = document.createElement('div');
        wrap.className = 'question';
        wrap.dataset.questionId = q.id;

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerHTML = `${q.sort_order}. ${q.question_text}${q.required ? '<span class="required-mark">*</span>' : ''}`;
        wrap.appendChild(title);

        if (q.question_type === 'yesno') {
          const radio = document.createElement('div');
          radio.className = 'radio-group';
          radio.innerHTML = `
            <label class="choice choice-yes">
              <input type="radio" name="q_${q.id}" value="예">
              <span>예</span>
            </label>
            <label class="choice choice-no">
              <input type="radio" name="q_${q.id}" value="아니오">
              <span>아니오</span>
            </label>
          `;
          wrap.appendChild(radio);

          const correctionWrap = document.createElement('div');
          correctionWrap.className = 'correction-wrap hidden';
          correctionWrap.innerHTML = `
            <label>아니오인 경우 조치 내용</label>
            <textarea rows="3" class="correction" placeholder="조치 내용 입력"></textarea>
          `;
          wrap.appendChild(correctionWrap);

          radio.addEventListener('change', (e) => {
            const selected = e.target?.value;
            if (!selected) return;

            correctionWrap.classList.toggle('hidden', selected !== '아니오');
          });
        } else {
          const ta = document.createElement('textarea');
          ta.rows = 4;
          ta.className = 'text-answer';
          ta.placeholder = q.required ? '입력' : '선택 입력';
          wrap.appendChild(ta);
        }

        questionsArea.appendChild(wrap);
      });
    }

    async function loadBusinessUnits() {
      const { data, error } = await supabase
        .from('business_units')
        .select('*')
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) {
        alert('사업단 불러오기 실패: ' + error.message);
        return;
      }

      businessUnitSelect.innerHTML = '<option value="">사업단 선택</option>';
      locationSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      workContentSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      introText.textContent = '사업단을 선택하세요.';
      questionsArea.innerHTML = '';
      currentTemplate = null;
      currentQuestions = [];

      if (!data || data.length === 0) {
        businessUnitSelect.innerHTML = '<option value="">등록된 사업단 없음</option>';
        locationSelect.innerHTML = '<option value="">등록된 장소 없음</option>';
        workContentSelect.innerHTML = '<option value="">등록된 작업내용 없음</option>';
        return;
      }

      data.forEach(unit => {
        const opt = document.createElement('option');
        opt.value = unit.id;
        opt.textContent = unit.name;
        businessUnitSelect.appendChild(opt);
      });
    }

    async function loadLocations(businessUnitId) {
      const { data, error } = await supabase
        .from('business_locations')
        .select('*')
        .eq('business_unit_id', businessUnitId)
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) {
        alert('장소 불러오기 실패: ' + error.message);
        return;
      }

      locationSelect.innerHTML = '<option value="">장소 선택</option>';
      if (!data || data.length === 0) {
        locationSelect.innerHTML = '<option value="">등록된 장소 없음</option>';
        return;
      }

      data.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc.name;
        opt.textContent = loc.name;
        locationSelect.appendChild(opt);
      });
    }

    async function loadWorkContents(businessUnitId) {
      const { data, error } = await supabase
        .from('business_work_contents')
        .select('*')
        .eq('business_unit_id', businessUnitId)
        .eq('active', true)
        .order('name', { ascending: true });

      if (error) {
        alert('작업내용 불러오기 실패: ' + error.message);
        return;
      }

      workContentSelect.innerHTML = '<option value="">작업내용 선택</option>';
      if (!data || data.length === 0) {
        workContentSelect.innerHTML = '<option value="">등록된 작업내용 없음</option>';
        return;
      }

      data.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        workContentSelect.appendChild(opt);
      });
    }

    async function loadTemplateAndLists(businessUnitId) {
      if (!businessUnitId) {
        introText.textContent = '사업단을 선택하세요.';
        questionsArea.innerHTML = '';
        locationSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
        workContentSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
        currentTemplate = null;
        currentQuestions = [];
        return;
      }

      const { data: template, error: tplErr } = await supabase
        .from('checklist_templates')
        .select('*')
        .eq('business_unit_id', businessUnitId)
        .eq('active', true)
        .order('version', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (tplErr) {
        alert('템플릿 불러오기 실패: ' + tplErr.message);
        return;
      }

      currentTemplate = template;

      if (!template) {
        introText.textContent = '활성화된 체크리스트가 없습니다.';
        questionsArea.innerHTML = '';
        currentQuestions = [];
        await loadLocations(businessUnitId);
        await loadWorkContents(businessUnitId);
        return;
      }

      introText.textContent = template.intro_text || '';

      const { data: questions, error: qErr } = await supabase
        .from('checklist_questions')
        .select('*')
        .eq('template_id', template.id)
        .eq('active', true)
        .order('sort_order', { ascending: true });

      if (qErr) {
        alert('질문 불러오기 실패: ' + qErr.message);
        return;
      }

      currentQuestions = questions || [];
      renderQuestions();
      await loadLocations(businessUnitId);
      await loadWorkContents(businessUnitId);
    }

    businessUnitSelect.addEventListener('change', () => {
      loadTemplateAndLists(businessUnitSelect.value);
    });

    submitBtn.addEventListener('click', async () => {
      if (!businessUnitSelect.value) return alert('사업단을 선택하세요.');
      if (!workerName.value.trim()) return alert('이름을 입력하세요.');
      if (!workDatetime.value) return alert('일시를 입력하세요.');
      if (!locationSelect.value) return alert('장소를 선택하세요.');
      if (!workContentSelect.value) return alert('작업내용을 선택하세요.');
      if (!currentTemplate) return alert('활성 체크리스트가 없습니다.');

      const answers = [];

      for (const q of currentQuestions) {
        const block = questionsArea.querySelector(`[data-question-id="${q.id}"]`);

        if (q.question_type === 'yesno') {
          const checked = block.querySelector(`input[name="q_${q.id}"]:checked`);
          if (!checked) return alert(`"${q.question_text}"에 답하세요.`);

          const yesno = checked.value;
          const correction = block.querySelector('.correction').value.trim();

          if (yesno === '아니오' && !correction) {
            return alert(`"${q.question_text}"에서 아니오 선택 시 조치 내용을 입력하세요.`);
          }

          answers.push({
            question_id: q.id,
            answer_yesno: yesno,
            correction_text: yesno === '아니오' ? correction : '',
            text_answer: ''
          });
        } else {
          const text = block.querySelector('.text-answer').value.trim();
          if (q.required && !text) return alert(`"${q.question_text}"을(를) 입력하세요.`);

          answers.push({
            question_id: q.id,
            answer_yesno: '',
            correction_text: '',
            text_answer: text
          });
        }
      }

      const payload = {
        business_unit_id: businessUnitSelect.value,
        template_id: currentTemplate.id,
        worker_name: workerName.value.trim(),
        work_datetime: new Date(workDatetime.value).toISOString(),
        location: locationSelect.value,
        work_content: workContentSelect.value,
        answers
      };

      const { error } = await supabase.rpc('submit_checklist', { payload });
      if (error) {
        alert('제출 실패: ' + error.message);
        return;
      }

      alert('제출 완료');
      workerName.value = '';
      setDefaultDatetime();
      locationSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      workContentSelect.innerHTML = '<option value="">사업단을 먼저 선택하세요</option>';
      questionsArea.innerHTML = '';
      introText.textContent = '사업단을 선택하세요.';
      currentTemplate = null;
      currentQuestions = [];
    });

    setDefaultDatetime();
    loadBusinessUnits();
  </script>
</body>
</html>
